services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: rag_example
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag_local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - vector_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_example"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  vector_data:
